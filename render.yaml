services:
  # Backend API Web Service
  - type: web
    name: exploregini-api
    env: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_1U0pjSiAKgIM@ep-plain-cherry-aywmz4ls.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "*"

  # Frontend Static Site
  - type: web
    name: exploregini-frontend
    env: static
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: exploregini-api
          property: host


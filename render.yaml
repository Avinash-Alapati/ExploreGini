services:
  # Backend API Web Service
  - type: web
    name: exploregini-api
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: exploregini-db
          property: connectionString
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "*"

  # Frontend Static Site
  - type: web
    name: exploregini-frontend
    runtime: static
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: exploregini-api
          property: host

databases:
  # Managed PostgreSQL Database
  - name: exploregini-db
    databaseName: ycombinator_db
    user: postgres
    plan: free
    region: oregon
    postgresMajorVersion: 16
